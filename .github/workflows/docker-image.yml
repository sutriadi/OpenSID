name: Build & Push Docker Image

on:
  push:
    branches: [umum, 'ci/**']
    tags: ['v*']
  pull_request:
    paths: ['docker/**', '.github/workflows/docker-image.yml']
  workflow_dispatch:
  schedule:
    # Bangun ulang tiap Senin (UTC) agar paket OS di base image tetap mendapat patch keamanan
    - cron: '17 3 * * 1'

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  image:
    name: Build image
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        if: ${{ vars.DOCKER_PLATFORMS != '' && vars.DOCKER_PLATFORMS != 'linux/amd64' }}
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/opensid
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short
            type=ref,event=pr

      # Build satu platform (amd64) dan jalankan uji cepat sebelum apa pun dipush
      - name: Build (amd64) untuk uji cepat
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          load: true
          tags: opensid:smoke
          build-args: |
            OPENSID_REF=${{ github.ref_name }}
            OPENSID_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Uji cepat (ekstensi PHP, konfigurasi Apache, file sensitif)
        run: |
          set -eux
          docker run --rm --entrypoint php opensid:smoke -v
          docker run --rm --entrypoint php opensid:smoke -r '
            foreach (["pdo_mysql","curl","fileinfo","gd","iconv","json","mbstring","mysqli","mysqlnd","tidy","zip","exif","intl","bcmath"] as $e) {
              if (!extension_loaded($e)) { fwrite(STDERR, "hilang: $e\n"); exit(1); }
            }
            echo "ekstensi OK\n";'
          docker run --rm --entrypoint apache2ctl opensid:smoke -t
          docker run --rm --entrypoint sh opensid:smoke -c 'test -f /var/www/html/vendor/autoload.php && test -f /var/www/html/.htaccess && test ! -e /var/www/html/docker && test ! -e /var/www/html/.git'
          # Tanpa konfigurasi database, entrypoint harus berhenti dengan pesan jelas
          if docker run --rm opensid:smoke true; then echo "seharusnya gagal"; exit 1; fi

      - name: Build & push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ vars.DOCKER_PLATFORMS || 'linux/amd64' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            OPENSID_REF=${{ github.ref_name }}
            OPENSID_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
