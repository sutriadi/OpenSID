name: Preview (uji first-run + live preview)

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: 'Durasi live preview (menit)'
        default: '15'
      tunnel:
        description: 'Buka tunnel publik (true/false)'
        default: 'true'
  push:
    branches: ['ci/**']
    paths: ['.github/workflows/preview.yml']

permissions:
  contents: read
  statuses: write

concurrency:
  group: opensid-preview
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MINUTES: ${{ github.event.inputs.minutes || '15' }}
      TUNNEL: ${{ github.event.inputs.tunnel || 'true' }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image (pakai cache dari workflow build)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          load: true
          tags: opensid:preview
          cache-from: type=gha

      - name: "Jalankan stack hardened (mode uji, captcha dimatikan) dan tunggu first-run"
        run: .github/scripts/stack-up.sh opensid:preview testing

      - name: Periksa database dan header proxy
        run: |
          set -u
          . docker/.env
          echo "Jumlah tabel di database:"
          $COMPOSE exec -T db mariadb -uopensid -p"$DB_PASSWORD" opensid -N -e 'SHOW TABLES' | wc -l
          echo "Pengguna awal:"
          $COMPOSE exec -T db mariadb -uopensid -p"$DB_PASSWORD" opensid -e 'SELECT id, username FROM user LIMIT 3' || true
          echo "Folder desa di volume:"
          $COMPOSE exec -T web ls desa desa/config
          echo "Pemeriksaan keamanan:"
          .github/scripts/security-checks.sh || echo "::warning title=Pemeriksaan keamanan gagal::lihat log langkah ini"
          echo "Tautan di belakang proxy TLS (harus https://preview.test, tanpa http://preview.test):"
          curl -s -H 'Host: preview.test' -H 'X-Forwarded-Proto: https' http://localhost:8080/ | grep -oE 'https?://preview\.test' | sort | uniq -c

      - name: Uji browser (beranda + login admin) dengan Playwright
        run: |
          set -eu
          mkdir -p /tmp/pw /tmp/shots && cd /tmp/pw
          npm init -y >/dev/null
          npm i playwright >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > test.mjs <<'JS'
          import { chromium } from 'playwright';
          const base = process.env.BASE || 'http://localhost:8080';
          const b = await chromium.launch();
          const p = await b.newPage({ viewport: { width: 1280, height: 800 } });
          await p.goto(base + '/', { waitUntil: 'networkidle', timeout: 120000 });
          await p.screenshot({ path: '/tmp/shots/1-beranda.png', fullPage: true });
          console.log('Beranda:', p.url(), '|', await p.title());
          await p.goto(base + '/siteman', { waitUntil: 'networkidle' });
          await p.screenshot({ path: '/tmp/shots/2-login.png' });
          await p.fill('input[name=username]', 'admin');
          await p.fill('#password', process.env.ADMIN_PW);
          await Promise.all([
            p.waitForNavigation({ waitUntil: 'networkidle', timeout: 60000 }).catch(() => {}),
            p.click('button[type=submit]'),
          ]);
          await p.screenshot({ path: '/tmp/shots/3-setelah-login.png', fullPage: true });
          console.log('Setelah login:', p.url(), '|', await p.title());
          console.log((await p.locator('body').innerText()).slice(0, 400));
          const gagal = /\/siteman(\/auth)?\/?(\?.*)?$/.test(new URL(p.url()).pathname);
          await b.close();
          if (gagal) { console.error('Login tidak berpindah dari halaman siteman'); process.exit(1); }
          JS
          node test.mjs

      - name: Beralih ke mode produksi (captcha aktif)
        run: |
          set -u
          # tanpa override CI_ENV=testing -> mode produksi (captcha aktif); container web dibuat ulang
          docker compose -f docker/docker-compose.yml --env-file docker/.env up -d
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -L --max-time 60 http://localhost:8080/ || true)
            echo "percobaan $i: HTTP $code"; [ "$code" = 200 ] && break; sleep 3
          done
          [ "$code" = 200 ]

      - name: Live preview lewat tunnel
        if: ${{ env.TUNNEL == 'true' }}
        run: |
          set -u
          curl -fsSL -o /tmp/cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x /tmp/cloudflared
          nohup /tmp/cloudflared tunnel --no-autoupdate --url http://localhost:8080 > /tmp/cf.log 2>&1 &
          URL=
          for i in $(seq 1 30); do
            URL=$(grep -o 'https://[a-z0-9-]*\.trycloudflare\.com' /tmp/cf.log | head -1 || true)
            [ -n "$URL" ] && break; sleep 2
          done
          if [ -z "$URL" ]; then echo "::error title=Tunnel gagal::URL tidak muncul"; cat /tmp/cf.log; exit 1; fi
          echo "$URL" > /tmp/preview_url
          # Status commit dibaca langsung dari API/UI selama job berjalan
          curl -fsS -X POST -H "Authorization: Bearer ${{ github.token }}" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -d "{\"state\":\"success\",\"context\":\"preview/url\",\"description\":\"Live preview aktif ${MINUTES} menit\",\"target_url\":\"$URL\"}" >/dev/null || echo "gagal menulis status"
          echo "::notice title=Preview URL::$URL (aktif ${MINUTES} menit; login admin / lihat ringkasan job)"
          { echo "### Live preview"; echo; echo "$URL"; echo; echo "Aktif ${MINUTES} menit. Login: admin / Ci_Test2026+ (captcha aktif; password uji khusus job ini)."; } >> "$GITHUB_STEP_SUMMARY"
          sleep 8
          for i in $(seq 1 10); do
            c=$(curl -s -o /dev/null -w '%{http_code}' -L --max-time 30 "$URL/" || true)
            echo "tunnel dicek dari runner: HTTP $c"; [ "$c" = 200 ] && break; sleep 4
          done
          # Uji dari sisi pengunjung lewat TLS tunnel: cari mixed content / request gagal
          cd /tmp/pw
          cat > tunnel.mjs <<'JS'
          import { chromium } from 'playwright';
          const base = process.env.BASE;
          const b = await chromium.launch();
          const p = await b.newPage({ viewport: { width: 1280, height: 800 } });
          const gagal = [], konsol = [];
          p.on('requestfailed', r => gagal.push(r.url() + ' ' + (r.failure()?.errorText || '')));
          p.on('response', r => { if (r.status() >= 400) gagal.push(r.status() + ' ' + r.url()); });
          p.on('console', m => { if (/mixed content|blocked/i.test(m.text())) konsol.push(m.text()); });
          for (const [nama, path] of [['beranda', '/'], ['login', '/siteman']]) {
            await p.goto(base + path, { waitUntil: 'networkidle', timeout: 90000 });
            await p.screenshot({ path: `/tmp/shots/tunnel-${nama}.png`, fullPage: true });
            console.log(nama, p.url(), '|', await p.title());
          }
          console.log('Request gagal/4xx/5xx:', gagal.length); gagal.slice(0, 15).forEach(x => console.log('  ', x));
          console.log('Mixed content:', konsol.length); konsol.slice(0, 5).forEach(x => console.log('  ', x));
          await b.close();
          JS
          BASE="$URL" node tunnel.mjs || echo "uji tunnel gagal (tidak menghentikan preview)"
          cd - >/dev/null
          END=$(( $(date +%s) + MINUTES * 60 ))
          while [ "$(date +%s)" -lt "$END" ]; do sleep 30; done
          echo "Waktu preview habis."

      - name: Kumpulkan log
        if: always()
        run: |
          mkdir -p /tmp/shots
          $COMPOSE logs --no-color > /tmp/shots/compose.log 2>&1 || true
          cp /tmp/cf.log /tmp/shots/cloudflared.log 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preview-bukti
          path: /tmp/shots
          if-no-files-found: ignore
