; Pengaturan PHP untuk OpenSID. Timpa dengan memasang file .ini lain ke /usr/local/etc/php/conf.d/
memory_limit = 512M
upload_max_filesize = 64M
post_max_size = 64M
max_execution_time = 300
max_input_vars = 5000

opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; kode di image tidak berubah selama container hidup
opcache.validate_timestamps = 0
