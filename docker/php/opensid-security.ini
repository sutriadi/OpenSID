; Pengerasan PHP. Timpa dengan memasang file .ini milik Anda (nama berurutan setelah zz-opensid-security.ini).
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
html_errors = Off
allow_url_include = Off
file_uploads = On
session.use_strict_mode = 1
session.use_only_cookies = 1
session.cookie_samesite = Lax
; Mematikan pemeriksaan assert() di produksi (tidak dipakai kode OpenSID) -- assert() adalah fungsi,
; bukan konstruksi bahasa, sehingga assert($_POST[...]) adalah pola webshell satu-baris yang umum.
zend.assertions = -1
; Fungsi eksekusi perintah OS dimatikan. Dampak: pembatalan job latar (JobProses) dan konversi
; gambar via ImageMagick CLI di rfm/ tidak tersedia. Kosongkan nilainya bila fitur itu dibutuhkan.
; assert ikut dimatikan di sini juga (bukan hanya lewat zend.assertions) karena disable_functions
; benar-benar menghilangkan fungsinya, sedangkan zend.assertions=-1 hanya membuat assert() selalu
; TRUE tanpa menjalankan isi argumennya untuk assert() gaya lama (non-zend_assert) -- dua lapis.
disable_functions = assert,exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec,pcntl_fork,pcntl_signal,dl,show_source,symlink,link
