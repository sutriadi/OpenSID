ServerName localhost
ServerTokens Prod
ServerSignature Off

# Container ini biasanya berada di belakang reverse proxy yang mengakhiri TLS.
# OpenSID membentuk base_url dari $_SERVER['HTTPS'], jadi teruskan dari header proxy.
SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on

<Directory /var/www/html>
    AllowOverride All
    Options -Indexes +FollowSymLinks
    Require all granted
</Directory>
